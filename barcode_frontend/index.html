<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { margin:0; padding:0; font-family: sans-serif; background:transparent; }
  
  #controls { 
    text-align:center; 
    padding:10px; 
  }
  
  button { 
    background:#0056b3; color:white; border:none; 
    padding:12px 24px; border-radius:8px; 
    font-weight:bold; cursor:pointer; margin:4px;
    font-size:14px;
    transition: all 0.3s ease;
  }
  button:hover:not(:disabled) {
    background:#004494;
    transform: scale(1.02);
  }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  
  /* ============================================
     FIX POSISI KAMERA
     ============================================ */
  
  /* Container utama kamera */
  #reader { 
    width:100%; 
    margin-top: -20px;        /* Naikin dikit ke atas */
    margin-bottom: 10px;
  }
  
  /* Video preview — perbesar & atur posisi */
  #reader video {
    border-radius: 12px;
    width: 100% !important;   /* Full width */
    max-height: 400px !important;
    object-fit: cover !important;
    margin-top: 0 !important;
  }
  
  /* Region scan — naikin posisi kotak scan */
  #reader__scan_region {
    margin-top: -10px !important;
  }
  
  /* Dashboard (kotak scan overlay) — center & naikin */
  #reader__dashboard {
    margin-top: -30px !important;  /* Naikin dikit */
  }
  
  /* Kotak scan (qrbox) — kasih border biar keliatan jelas */
  #reader__scan_region img {
    margin-top: 10px;
  }
  
  /* ============================================ */
  
  #status { 
    text-align:center; padding:10px; 
    font-weight:bold; font-size:14px;
    color: #333;
  }
  
  #counter {
    text-align:center; padding:8px;
    background:#e8f4ff; border-radius:8px;
    font-size:13px; font-weight:bold; color:#0056b3;
    margin: 8px 0;
  }
</style>
</head>
<body>
  <div id="controls">
    <button id="startBtn">📷 Mulai Scan</button>
    <button id="stopBtn" disabled>❌ Stop</button>
  </div>
  <div id="counter">📦 Resi di-scan sesi ini: <span id="countNum">0</span></div>
  <div id="reader"></div>
  <div id="status">Kamera mati. Klik "Mulai Scan" untuk menyalakan.</div>

<script>
let scanner = null;
let isRunning = false;
let scanCount = 0;

// ============================================
// BEEP SOUND — pakai Web Audio API
// ============================================
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    osc.frequency.value = 1000;
    osc.type = "square";
    
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.15);
    
    setTimeout(() => ctx.close(), 300);
  } catch (e) {
    console.log("Beep gagal:", e);
  }
}

// ============================================
// VIBRASI HP
// ============================================
function vibrate() {
  if (navigator.vibrate) {
    navigator.vibrate(150);
  }
}

// ============================================
// KOMUNIKASI KE STREAMLIT
// ============================================
function sendToStreamlit(payload) {
  window.parent.postMessage({
    isStreamlitMessage: true,
    ...payload
  }, "*");
}

sendToStreamlit({ type: "streamlit:componentReady", apiVersion: 1 });
sendToStreamlit({ type: "streamlit:setFrameHeight", height: 520 });

function updateStatus(msg, color) {
  const el = document.getElementById("status");
  el.innerText = msg;
  el.style.color = color || "#333";
}

function updateCounter() {
  document.getElementById("countNum").innerText = scanCount;
}

// ============================================
// START SCANNER
// ============================================
document.getElementById("startBtn").addEventListener("click", async () => {
  if (isRunning) return;
  
  document.getElementById("startBtn").disabled = true;
  updateStatus("Menyalakan kamera...", "#0056b3");
  
  try {
    scanner = new Html5Qrcode("reader");
    await scanner.start(
      { facingMode: "environment" },
      { 
        fps: 10, 
        qrbox: { width: 280, height: 160 }   // Sedikit gede dari sebelumnya
      },
      (decodedText) => {
        playBeep();
        vibrate();
        
        scanCount++;
        updateCounter();
        
        updateStatus("✅ " + decodedText, "green");
        
        sendToStreamlit({ 
          type: "streamlit:setComponentValue", 
          value: decodedText
        });
        
        stopScanner();
      },
      () => { /* abaikan error per frame */ }
    );
    
    isRunning = true;
    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = false;
    updateStatus("📷 Kamera nyala. Arahin ke barcode...", "#0056b3");
  } catch (err) {
    updateStatus("❌ Gagal nyalain kamera: " + err, "red");
    document.getElementById("startBtn").disabled = false;
  }
});

// ============================================
// STOP SCANNER
// ============================================
async function stopScanner() {
  if (!scanner || !isRunning) return;
  try {
    await scanner.stop();
    scanner.clear();
  } catch (e) {}
  isRunning = false;
  document.getElementById("stopBtn").disabled = true;
  updateStatus("Kamera mati. Klik 'Mulai Scan' untuk menyalakan.");
}

document.getElementById("stopBtn").addEventListener("click", stopScanner);
</script>
</body>
</html>
