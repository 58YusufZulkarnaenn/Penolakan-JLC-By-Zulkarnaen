<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { margin:0; padding:0; font-family: sans-serif; background:transparent; }
  
  #controls { 
    text-align:center; 
    padding:10px; 
  }
  
  button { 
    background:#0056b3; color:white; border:none; 
    padding:12px 24px; border-radius:8px; 
    font-weight:bold; cursor:pointer; margin:4px;
    font-size:14px;
    transition: all 0.3s ease;
  }
  button:hover:not(:disabled) {
    background:#004494;
    transform: scale(1.02);
  }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  
  /* ============================================
     FIX POSISI KAMERA
     ============================================ */
  
  /* Container utama kamera */
  #reader { 
    width:100%; 
    margin-top: -20px;
    margin-bottom: 10px;
  }
  
  /* Video preview — perbesar & atur posisi */
  #reader video {
    border-radius: 12px;
    width: 100% !important;
    max-height: 400px !important;
    object-fit: cover !important;
    margin-top: 0 !important;
  }
  
  /* Region scan — naikin posisi kotak scan */
  #reader__scan_region {
    margin-top: -10px !important;
  }
  
  /* Dashboard (kotak scan overlay) — center & naikin */
  #reader__dashboard {
    margin-top: -30px !important;
  }
  
  /* Kotak scan (qrbox) — kasih border biar keliatan jelas */
  #reader__scan_region img {
    margin-top: 10px;
  }
  
  /* ============================================ */
  
  #status { 
    text-align:center; padding:10px; 
    font-weight:bold; font-size:14px;
    color: #333;
  }
  
  #counter {
    text-align:center; padding:8px;
    background:#e8f4ff; border-radius:8px;
    font-size:13px; font-weight:bold; color:#0056b3;
    margin: 8px 0;
  }
</style>
</head>
<body>
  <div id="controls">
    <button id="startBtn">📷 Mulai Scan</button>
    <button id="stopBtn" disabled>❌ Stop</button>
  </div>
  <div id="counter">📦 Resi di-scan sesi ini: <span id="countNum">0</span></div>
  <div id="reader"></div>
  <div id="status">Kamera mati. Klik "Mulai Scan" untuk menyalakan.</div>

<script>
let scanner = null;
let isRunning = false;
let scanCount = 0;

// ============================================
// BEEP SOUND — pakai Web Audio API
// ============================================
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    osc.frequency.value = 1000;
    osc.type = "square";
    
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.15);
    
    setTimeout(() => ctx.close(), 300);
  } catch (e) {
    console.log("Beep gagal:", e);
  }
}

// ============================================
// VIBRASI HP
// ============================================
function vibrate() {
  if (navigator.vibrate) {
    navigator.vibrate(150);
  }
}

// ============================================
// KOMUNIKASI KE STREAMLIT
// ============================================
function sendToStreamlit(payload) {
  window.parent.postMessage({
    isStreamlitMessage: true,
    ...payload
  }, "*");
}

sendToStreamlit({ type: "streamlit:componentReady", apiVersion: 1 });
sendToStreamlit({ type: "streamlit:setFrameHeight", height: 520 });

function updateStatus(msg, color) {
  const el = document.getElementById("status");
  el.innerText = msg;
  el.style.color = color || "#333";
}

function updateCounter() {
  document.getElementById("countNum").innerText = scanCount;
}

// ============================================
// PILIH KAMERA TERBAIK (buat iPhone biar gak blur)
// ============================================
async function pilihKameraTerbaik() {
  try {
    // Minta izin kamera dulu (wajib sebelum bisa lihat label device)
    await navigator.mediaDevices.getUserMedia({ video: true });
    
    const devices = await Html5Qrcode.getCameras();
    console.log("Kamera tersedia:", devices);
    
    if (!devices || devices.length === 0) {
      return { facingMode: "environment" };
    }
    
    // Prioritas 1: cari lensa wide/close/macro (biasanya lebih bagus buat jarak dekat)
    for (const device of devices) {
      const label = (device.label || "").toLowerCase();
      if (label.includes('wide angle') || 
          label.includes('wide-angle') || 
          label.includes('close') || 
          label.includes('macro')) {
        console.log("Pilih lensa wide/macro:", device.label);
        return { deviceId: { exact: device.id } };
      }
    }
    
    // Prioritas 2: kalau ada lebih dari 1 kamera belakang, ambil yang kedua
    // (seringkali ini lensa wide-angle, bukan ultra-wide)
    const backCameras = devices.filter(d => {
      const label = (d.label || "").toLowerCase();
      return label.includes('back') || 
             label.includes('belakang') || 
             label.includes('rear') ||
             label.includes('environment');
    });
    
    if (backCameras.length > 1) {
      console.log("Pilih kamera belakang kedua:", backCameras[1].label);
      return { deviceId: { exact: backCameras[1].id } };
    } else if (backCameras.length === 1) {
      console.log("Pilih kamera belakang:", backCameras[0].label);
      return { deviceId: { exact: backCameras[0].id } };
    }
    
    // Prioritas 3: pakai kamera terakhir (biasanya kamera belakang di iPhone)
    console.log("Fallback ke kamera terakhir:", devices[devices.length - 1].label);
    return { deviceId: { exact: devices[devices.length - 1].id } };
    
  } catch (err) {
    console.log("Gagal pilih kamera, fallback:", err);
    return { facingMode: "environment" };
  }
}

// ============================================
// APPLY FOCUS & ZOOM SETELAH KAMERA NYALA
// ============================================
async function applyFocusFix() {
  try {
    const track = scanner.getRunningTrack();
    if (!track) return;
    
    const capabilities = track.getCapabilities();
    console.log("Kamera capabilities:", capabilities);
    
    const constraints = { advanced: [{}] };
    
    // Coba set zoom ke level menengah (bantu iPhone fokus)
    if (capabilities.zoom) {
      const maxZoom = capabilities.zoom.max || 2;
      const zoomValue = maxZoom > 2 ? 2.0 : maxZoom;
      constraints.advanced[0].zoom = zoomValue;
      console.log("Set zoom ke:", zoomValue);
    }
    
    // Coba set focus mode continuous (auto-focus terus-menerus)
    if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
      constraints.advanced[0].focusMode = 'continuous';
      console.log("Set focus mode: continuous");
    }
    
    // Apply constraints
    if (Object.keys(constraints.advanced[0]).length > 0) {
      await track.applyConstraints(constraints);
      console.log("Focus fix applied!");
    }
    
  } catch (err) {
    console.log("Gagal apply focus fix:", err);
  }
}

// ============================================
// START SCANNER
// ============================================
document.getElementById("startBtn").addEventListener("click", async () => {
  if (isRunning) return;
  
  document.getElementById("startBtn").disabled = true;
  updateStatus("Menyalakan kamera...", "#0056b3");
  
  try {
    // 1. Pilih kamera terbaik
    const cameraConfig = await pilihKameraTerbaik();
    console.log("Config kamera:", cameraConfig);
    
    // 2. Mulai scanner
    scanner = new Html5Qrcode("reader");
    await scanner.start(
      cameraConfig,
      { 
        fps: 10, 
        qrbox: { width: 280, height: 160 }
      },
      (decodedText) => {
        playBeep();
        vibrate();
        
        scanCount++;
        updateCounter();
        
        updateStatus("✅ " + decodedText, "green");
        
        sendToStreamlit({ 
          type: "streamlit:setComponentValue", 
          value: decodedText
        });
        
        stopScanner();
      },
      () => { /* abaikan error per frame */ }
    );
    
    isRunning = true;
    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = false;
    updateStatus("📷 Kamera nyala. Arahin ke barcode...", "#0056b3");
    
    // 3. Trik FIX: Reset fokus setelah kamera nyala (delay 1.5s)
    setTimeout(() => {
      applyFocusFix();
    }, 1500);
    
    // 4. Coba apply focus fix lagi setelah 3 detik (double tap)
    setTimeout(() => {
      applyFocusFix();
    }, 3000);
    
  } catch (err) {
    updateStatus("❌ Gagal nyalain kamera: " + err, "red");
    document.getElementById("startBtn").disabled = false;
    console.error("Error start scanner:", err);
  }
});

// ============================================
// STOP SCANNER
// ============================================
async function stopScanner() {
  if (!scanner || !isRunning) return;
  try {
    await scanner.stop();
    scanner.clear();
  } catch (e) {}
  isRunning = false;
  document.getElementById("stopBtn").disabled = true;
  updateStatus("Kamera mati. Klik 'Mulai Scan' untuk menyalakan.");
}

document.getElementById("stopBtn").addEventListener("click", stopScanner);
</script>
</body>
</html>
