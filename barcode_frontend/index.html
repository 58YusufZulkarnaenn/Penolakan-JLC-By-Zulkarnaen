<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { margin:0; padding:0; font-family: sans-serif; background:transparent; }
  #controls { text-align:center; padding:10px; }
  button { 
    background:#0056b3; color:white; border:none; 
    padding:12px 24px; border-radius:8px; 
    font-weight:bold; cursor:pointer; margin:4px;
    font-size:14px;
    transition: all 0.3s ease;
  }
  button:hover:not(:disabled) {
    background:#004494;
    transform: scale(1.02);
  }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  #reader { width:100%; }
  #status { 
    text-align:center; padding:10px; 
    font-weight:bold; font-size:14px;
    color: #333;
  }
  #reader video {
    border-radius: 10px;
  }
</style>
</head>
<body>
  <div id="controls">
    <button id="startBtn">📷 Mulai Scan</button>
    <button id="stopBtn" disabled>❌ Stop</button>
  </div>
  <div id="reader"></div>
  <div id="status">Kamera mati. Klik "Mulai Scan" untuk menyalakan.</div>

<script>
let scanner = null;
let isRunning = false;

function sendToStreamlit(payload) {
  window.parent.postMessage({
    isStreamlitMessage: true,
    ...payload
  }, "*");
}

// Kasih tau Streamlit kalau component udah siap
sendToStreamlit({ type: "streamlit:componentReady", apiVersion: 1 });
sendToStreamlit({ type: "streamlit:setFrameHeight", height: 400 });

function updateStatus(msg, color) {
  const el = document.getElementById("status");
  el.innerText = msg;
  el.style.color = color || "#333";
}

document.getElementById("startBtn").addEventListener("click", async () => {
  if (isRunning) return;
  
  document.getElementById("startBtn").disabled = true;
  updateStatus("Menyalakan kamera...", "#0056b3");
  
  try {
    scanner = new Html5Qrcode("reader");
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 150 } },
      (decodedText) => {
        updateStatus("✅ " + decodedText, "green");
        // Kirim hasil ke Python
        sendToStreamlit({ 
          type: "streamlit:setComponentValue", 
          value: decodedText
        });
        // Auto matiin kamera setelah berhasil
        stopScanner();
      },
      () => { /* abaikan error per frame (barcode belum kedeteksi) */ }
    );
    
    isRunning = true;
    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = false;
    updateStatus("📷 Kamera nyala. Arahin ke barcode...", "#0056b3");
  } catch (err) {
    updateStatus("❌ Gagal nyalain kamera: " + err, "red");
    document.getElementById("startBtn").disabled = false;
  }
});

async function stopScanner() {
  if (!scanner || !isRunning) return;
  try {
    await scanner.stop();
    scanner.clear();
  } catch (e) {}
  isRunning = false;
  document.getElementById("stopBtn").disabled = true;
  updateStatus("Kamera mati. Klik 'Mulai Scan' untuk menyalakan.");
}

document.getElementById("stopBtn").addEventListener("click", stopScanner);
</script>
</body>
</html>
